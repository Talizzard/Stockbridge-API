[package]
name = "stockbridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono", "macros", "tls-rustls"] }
tokio = { version = "1.53.3", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
